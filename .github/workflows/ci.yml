name: CI — Backend & Frontend Tests

on:
  push:
    branches: [master, main, "cursor/**", "feature/**", "fix/**", "develop"]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

# ─────────────────────────────────────────────────────────────────────────────
# BACKEND JOB
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  backend-tests:
    name: Backend — Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend unit tests
        working-directory: backend
        env:
          NODE_ENV: test
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'test_secret_key_ci' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test_openai_key_ci' }}
        run: npm run test:unit

      - name: Run backend integration tests
        working-directory: backend
        env:
          NODE_ENV: test
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'test_secret_key_ci' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test_openai_key_ci' }}
        run: npm run test:integration

      - name: Run all backend tests (summary)
        working-directory: backend
        env:
          NODE_ENV: test
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'test_secret_key_ci' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test_openai_key_ci' }}
        run: npm test

# ─────────────────────────────────────────────────────────────────────────────
# FRONTEND JOB
# ─────────────────────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend — Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Run frontend integration tests
        working-directory: frontend
        run: npm run test:integration

      - name: Run all frontend tests (summary)
        working-directory: frontend
        run: npm test

# ─────────────────────────────────────────────────────────────────────────────
# BUILD JOB — only runs after tests pass
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build — Frontend Production Bundle
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000' }}
          VITE_ML_URL: ${{ secrets.VITE_ML_URL || 'https://insta-ml.onrender.com' }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# ML SERVICE JOB
# ─────────────────────────────────────────────────────────────────────────────
  ml-service-tests:
    name: ML Service — Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ml-service/requirements.txt

      - name: Install ML service dependencies
        working-directory: ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run ML service tests
        working-directory: ml-service
        env:
          ML_SERVICE_URL: http://localhost:8000
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v --tb=short
          else
            echo "No ml-service tests directory found — skipping"
            exit 0
          fi
