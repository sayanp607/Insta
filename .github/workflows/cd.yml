name: CD — Deploy to Render & Vercel

on:
  push:
    branches: [master, main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
# ─────────────────────────────────────────────────────────────────────────────
# RE-RUN TESTS BEFORE DEPLOY (gate)
# ─────────────────────────────────────────────────────────────────────────────
  pre-deploy-tests:
    name: Pre-Deploy Tests Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install & test backend
        working-directory: backend
        env:
          NODE_ENV: test
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'test_secret_key_ci' }}
        run: |
          npm ci
          npm test

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Test frontend
        working-directory: frontend
        run: npm test

# ─────────────────────────────────────────────────────────────────────────────
# BACKEND DEPLOY → RENDER (via deploy hook)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: pre-deploy-tests
    environment: production

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_URL secret not set — skipping deploy"
            exit 0
          fi
          echo "🚀 Triggering Render backend deploy..."
          curl -s -o /dev/null -w "%{http_code}" \
            --fail \
            -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "✅ Render deploy hook triggered successfully"

# ─────────────────────────────────────────────────────────────────────────────
# FRONTEND DEPLOY → VERCEL
# ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: pre-deploy-tests
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend for production
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_ML_URL: ${{ secrets.VITE_ML_URL }}
        run: npm run build

      - name: Deploy to Vercel Production
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠️  VERCEL_TOKEN secret not set — skipping deploy"
            exit 0
          fi
          vercel --prod --token="$VERCEL_TOKEN" --yes

# ─────────────────────────────────────────────────────────────────────────────
# ML SERVICE DEPLOY → RENDER (separate service)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-ml-service:
    name: Deploy ML Service to Render
    runs-on: ubuntu-latest
    needs: pre-deploy-tests
    environment: production

    steps:
      - name: Trigger ML Service Render Deploy Hook
        env:
          RENDER_ML_DEPLOY_HOOK_URL: ${{ secrets.RENDER_ML_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_ML_DEPLOY_HOOK_URL" ]; then
            echo "⚠️  RENDER_ML_DEPLOY_HOOK_URL secret not set — skipping ml-service deploy"
            exit 0
          fi
          echo "🧠 Triggering ML Service Render deploy..."
          curl -s -o /dev/null -w "%{http_code}" \
            --fail \
            -X POST "$RENDER_ML_DEPLOY_HOOK_URL"
          echo "✅ ML Service deploy hook triggered"
